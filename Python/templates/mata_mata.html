<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logos/img/ICON.png" type="image/x-icon">
    <title>{{ fase }} - Copa Paródia</title>
    <style>
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        h1 { color: #FFD700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); text-transform: uppercase; margin-bottom: 5px; text-align: center;}
        
        .confronto-box { background: rgba(0,0,0,0.5); border: 2px solid #00e5ff; border-radius: 12px; padding: 15px; width: 100%; max-width: 400px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,229,255,0.2); }
        .time { font-weight: bold; font-size: 16px; flex: 1; text-align: center; }
        .vs { color: #ff007f; font-weight: bold; margin: 0 10px; }
        
        .btn-simular { display: block; text-align: center; background: #00e5ff; color: #000; padding: 15px; text-decoration: none; border-radius: 10px; font-weight: bold; width: 100%; max-width: 400px; margin-top: 20px; text-transform: uppercase;}
    </style>
</head>
<body>
    <h1>⚔️ {{ fase }}</h1>
    
    {% for jogo in confrontos %}
        <div class="confronto-box">
            <div class="time">
                <img src="/static/logos/{{ jogo[0] }}.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041258.png';" width="40" height="40" style="border-radius: 50%; vertical-align: middle; margin-bottom: 5px;"><br>
                {{ jogo[0] }}
            </div>
            <div class="vs">VS</div>
            <div class="time">
                <img src="/static/logos/{{ jogo[1] }}.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041258.png';" width="40" height="40" style="border-radius: 50%; vertical-align: middle; margin-bottom: 5px;"><br>
                {{ jogo[1] }}
            </div>
        </div>
    {% endfor %}

    <a href="/simular_fase_mata_mata" class="btn-simular">Simular {{ fase }} 🔥</a>
</body>
</html>
