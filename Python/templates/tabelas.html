<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas da Copa - Paródia</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh; 
        }

        h1 { color: #00e5ff; text-shadow: 0 0 15px rgba(0, 229, 255, 0.6); text-align: center; text-transform: uppercase; margin-bottom: 5px; font-size: 26px;}
        p.subtitulo { color: #ff007f; font-weight: bold; margin-top: 0; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; text-align: center;}

        .grid-tabelas {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 30px;
        }

        .box-tabela { 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(0, 229, 255, 0.3); 
            border-radius: 12px; 
            padding: 15px; 
            width: 100%; 
            max-width: 450px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        .box-tabela h2 { color: #FFD700; margin-top: 0; margin-bottom: 10px; font-size: 20px; text-align: center;}

        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th { background: rgba(255, 255, 255, 0.1); padding: 8px; text-align: center; color: #ccc; font-weight: bold; }
        td { padding: 10px 5px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.05); }
        
        .nome-time-col { text-align: left; font-weight: bold; }
        
        /* Destaque para os 2 primeiros (Classificados) */
        .classificado { background: rgba(0, 255, 128, 0.1); }
        .classificado td:first-child { border-left: 4px solid #00ff80; }

        .btn-avancar { 
            background: #ff007f; 
            color: #fff; 
            padding: 15px 30px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 18px;
            box-shadow: 0 0 20px rgba(255, 0, 127, 0.5); 
            transition: 0.2s; 
            text-transform: uppercase;
            text-align: center;
        }
        .btn-avancar:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>📊 Classificação Final</h1>
    <p class="subtitulo">Fase de Grupos</p>

    <div class="grid-tabelas">
        {% for nome_grupo, tabela in tabelas.items() %}
            <div class="box-tabela">
                <h2>{{ nome_grupo }}</h2>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th class="nome-time-col">Equipa</th>
                            <th>Pts</th>
                            <th>J</th>
                            <th>V</th>
                            <th>E</th>
                            <th>D</th>
                            <th>SG</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for t in tabela %}
                        <tr class="{% if loop.index0 < 2 %}classificado{% endif %}">
                            <td>{{ loop.index }}</td>
                            <td class="nome-time-col"><img src="/static/logos/{{ t.Nome }}.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041258.png';" width="22" height="22" style="border-radius: 50%; vertical-align: middle; margin-right: 5px;"> {{ t.Nome }}</td>
                            <td style="color: #00e5ff; font-weight: bold;">{{ t.Pts }}</td>
                            <td>{{ t.J }}</td>
                            <td>{{ t.V }}</td>
                            <td>{{ t.E }}</td>
                            <td>{{ t.D }}</td>
                            <td>{{ t.SG }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        {% endfor %}
    </div>

        <a href="/sortear_mata_mata" class="btn-avancar">Avançar para o Mata-Mata ⚔️</a>

</body>
</html>
