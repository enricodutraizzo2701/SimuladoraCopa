<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logos/img/ICON.png" type="image/x-icon">
    <title>Sorteio do Mata-Mata</title>
    <style>
        body { background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; min-height: 100vh;}
        h1 { color: #ff007f; text-shadow: 0 0 15px rgba(255, 0, 127, 0.6); text-transform: uppercase; margin-bottom: 5px; text-align: center;}
        p.subtitulo { color: #00e5ff; font-weight: bold; margin-bottom: 30px; letter-spacing: 2px; animation: piscar 1s infinite; }
        
        @keyframes piscar { 50% { opacity: 0.4; } }

        #container-chaves { width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 15px; }

        .chave-box { background: rgba(0,0,0,0.6); border: 2px solid rgba(255, 0, 127, 0.3); border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; opacity: 0; transform: scale(0.8); transition: all 0.5s ease; box-shadow: 0 0 15px rgba(0,0,0,0.5);}
        .chave-box.revelado { opacity: 1; transform: scale(1); border-color: #ff007f; }
        
        .time { font-size: 18px; font-weight: bold; flex: 1; text-align: center; }
        .vs { font-size: 14px; color: #FFD700; background: rgba(255, 215, 0, 0.1); padding: 5px 10px; border-radius: 5px; }

        .btn-avancar { display: none; background: #00e5ff; color: #000; padding: 15px 30px; border-radius: 10px; font-weight: bold; font-size: 18px; text-decoration: none; margin-top: 30px; text-transform: uppercase; box-shadow: 0 0 20px #00e5ff;}
    </style>
</head>
<body>

    <h1>⚔️ Sorteio do Mata-Mata</h1>
    <p class="subtitulo" id="status-sorteio">Sorteando os confrontos...</p>

    <div id="container-chaves"></div>
    <a href="/central_torneio" class="btn-avancar" id="btn-ir">Ir para a Central 🚀</a>

    <script>
        const confrontos = {{ confrontos | tojson }};
        const container = document.getElementById("container-chaves");
        const statusSorteio = document.getElementById("status-sorteio");
        const btnIr = document.getElementById("btn-ir");

        let idx = 0;

        function revelarProximo() {
            if (idx < confrontos.length) {
                let jogo = confrontos[idx];
                
                let box = document.createElement("div");
                box.className = "chave-box";
                // AQUI ENTROU A CHAVE-MESTRA NO JAVASCRIPT!
                box.innerHTML = `<div class="time"><img src="/static/logos/${jogo[0]}.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041258.png';" width="35" height="35" style="border-radius: 50%; vertical-align: middle;"><br>${jogo[0]}</div><div class="vs">VS</div><div class="time"><img src="/static/logos/${jogo[1]}.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041258.png';" width="35" height="35" style="border-radius: 50%; vertical-align: middle;"><br>${jogo[1]}</div>`;
                container.appendChild(box);

                // Dá o efeito Pop-up
                setTimeout(() => { box.classList.add("revelado"); }, 50);
                
                box.scrollIntoView({ behavior: 'smooth', block: 'center' });

                idx++;
                setTimeout(revelarProximo, 1200); // Revela um confronto a cada 1.2 segundos
            } else {
                statusSorteio.innerText = "✨ CHAVEAMENTO DEFINIDO! ✨";
                statusSorteio.style.color = "#00ff80";
                statusSorteio.style.animation = "none";
                btnIr.style.display = "block";
                btnIr.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        setTimeout(revelarProximo, 1000);
    </script>
</body>
</html>
