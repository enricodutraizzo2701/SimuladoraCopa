<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/logos/img/ICON.png" type="image/x-icon">
    <title>Sorteio dos Grupos - Copa Paródia</title>
    <style>
        body { 
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 20px; 
            margin: 0; 
            min-height: 100vh; 
            box-sizing: border-box;
        }

        h1 { color: #FFD700; text-shadow: 0 0 15px rgba(255, 215, 0, 0.6); text-align: center; text-transform: uppercase; margin-bottom: 5px; font-size: 26px;}
        p.subtitulo { color: #00e5ff; font-weight: bold; margin-top: 0; margin-bottom: 30px; letter-spacing: 1px; text-transform: uppercase; text-align: center;}

        /* Grid para os Grupos */
        .grid-grupos {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            width: 100%;
            max-width: 900px;
            margin-bottom: 30px;
        }

        .card-grupo { 
            background: rgba(0, 0, 0, 0.5); 
            backdrop-filter: blur(10px); 
            border: 1px solid rgba(0, 229, 255, 0.3); 
            border-radius: 15px; 
            padding: 20px; 
            width: 100%; 
            max-width: 350px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .card-grupo:hover { border-color: #FFD700; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2); }

        .card-grupo h2 { color: #ff007f; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid rgba(255,0,127,0.3); padding-bottom: 10px; text-align: center; font-size: 22px;}

        .lista-times { list-style: none; padding: 0; margin: 0; }
        .lista-times li { 
            font-size: 16px; 
            color: #eee; 
            padding: 10px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            display: flex; 
            align-items: center; 
        }
        .lista-times li:last-child { border-bottom: none; }

        .btn-avancar { 
            background: #00e5ff; 
            color: #000; 
            padding: 15px 30px; 
            text-decoration: none; 
            border-radius: 10px; 
            font-weight: bold; 
            font-size: 18px;
            box-shadow: 0 0 20px rgba(0, 229, 255, 0.5); 
            transition: 0.2s; 
            text-transform: uppercase;
            text-align: center;
        }
        .btn-avancar:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <h1>🎲 Sorteio Oficial</h1>
    <p class="subtitulo">Fase de Grupos</p>

    <div class="grid-grupos">
        {% for nome_grupo, times in grupos.items() %}
            <div class="card-grupo">
                <h2>{{ nome_grupo }}</h2>
                <ul class="lista-times">
                    {% for time in times %}
                        <li>
                            <img src="/static/logos/{{ time }}.png" onerror="this.onerror=null; this.src='https://cdn-icons-png.flaticon.com/512/1041/1041258.png';" width="25" height="25" style="border-radius: 50%; vertical-align: middle; margin-right: 8px;">
                            {{ time }}
                        </li>
                    {% endfor %}
                </ul>
            </div>
        {% endfor %}
    </div>

        <a href="/simular_fase_grupos" class="btn-avancar">Simular Fase de Grupos 🚀</a>

</body>
</html>
